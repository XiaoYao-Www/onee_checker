name: Rust Multi-Platform Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# 同一時間只允許一個發布流程；後續推送排隊，避免競爭同一個標籤
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------
  # 1. 檢查版本與標籤 (Check Version)
  # ----------------------------
  check_version:
    name: Check Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_changed: ${{ steps.check_tag.outputs.changed }}
    steps:
      - name: 檢出程式碼 (Checkout)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 讀取 Cargo.toml 版本 (Get Version)
        id: get_version
        shell: bash
        run: |
          # 使用 grep 和 sed 提取版本號，避免編譯
          VERSION=$(grep -E '^version\s*=' Cargo.toml | head -1 | sed 's/version *= *"\(.*\)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "無法從 Cargo.toml 解析版本號" >&2
            exit 1
          fi
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 檢查標籤是否存在 (Check Tag)
        id: check_tag
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG_NAME="v${VERSION}_Auto"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists. Skipping build."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG_NAME not found. Proceeding with release."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  # ----------------------------
  # 2. 建置與打包 (Build & Package)
  # ----------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: check_version
    if: needs.check_version.outputs.version_changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            ext: .exe
            use_cross: false
            # Windows 可在原生 runner 上直接執行發布用的 GNU target 測試
            test_target: --target x86_64-pc-windows-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            use_cross: true
            # musl/aarch64 產物由 cross 建置；測試於下方主機 target 執行
            test_target: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            ext: ""
            use_cross: true
            test_target: ""

    steps:
      - name: 檢出程式碼 (Checkout)
        uses: actions/checkout@v7

      - name: 安裝 Rust 工具鏈 (Install Rust)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 設定 Cargo 快取 (Cache)
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 執行測試 (Test)
        shell: bash
        run: cargo test --release --locked ${{ matrix.test_target }}

      - name: 安裝 Cross (Install Cross)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: 編譯 (Build)
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: 打包壓縮 (Package)
        shell: bash
        run: |
          VERSION="${{ needs.check_version.outputs.version }}"
          # BIN_NAME 是 [[bin]] 定義的二進位名稱，不是 package name
          # Cargo.toml: name = "oneechk"
          BIN_NAME="oneechk"
          DIST_DIR="dist/${{ matrix.target }}"
          mkdir -p "$DIST_DIR"

          # 複製執行檔
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}" \
            "$DIST_DIR/${BIN_NAME}-${VERSION}${{ matrix.ext }}"

          # 複製 README 與 LICENSE 到發布包
          cp README.md LICENSE NOTICE "$DIST_DIR/"

          # 進入目錄打包，避免壓縮檔包含路徑
          cd dist

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # 在 Windows 上使用 PowerShell 內建的壓縮功能
            powershell -Command "Compress-Archive -Path '${{ matrix.target }}/*' -DestinationPath '${BIN_NAME}-${VERSION}-${{ matrix.target }}.zip'"
          else
            # 在 Linux/macOS 上使用 zip
            zip -r "${BIN_NAME}-${VERSION}-${{ matrix.target }}.zip" "${{ matrix.target }}"
          fi

      - name: 上傳構建產物 (Upload Artifact)
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.target }}
          path: dist/*.zip

  # ----------------------------
  # 3. 發布 Release (Create Release)
  # ----------------------------
  release:
    name: Create Release
    needs: [check_version, build]
    if: needs.check_version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 檢出程式碼 (Checkout)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 下載構建產物 (Download Artifacts)
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: artifact-*
          merge-multiple: true

      - name: 產生變更日誌 (Generate Changelog)
        id: changelog
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Last tag: $LAST_TAG"

          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" | tr -d '\r')
          else
            CHANGELOG=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)" | tr -d '\r')
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="無變更內容"
          fi

          # 使用多行輸出格式
          {
            echo "body<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 建立 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check_version.outputs.version }}_Auto
          name: "Version ${{ needs.check_version.outputs.version }} Auto"
          body: |
            ### 變更內容
            ${{ steps.changelog.outputs.body }}
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
